          <h2>What is OJEET Tracker?</h2>
          <p>
            OJEET Tracker is a free, offline-first study tracker and daily planner engineered
            specifically for JEE and NEET aspirants. It operates entirely inside the browser without
            requiring an active internet connection, storing data locally via IndexedDB. Aspirants
            can seamlessly organize daily schedules, execute 4-stage revision cycles, and log
            focused preparation hours with zero latency or subscription paywalls.
          </p>
        </section>

          <h2>JEE &amp; NEET Syllabus Coverage &amp; Revision Tracking</h2>
          <p>
            OJEET Tracker provides comprehensive syllabus tracking across 90+ PCM chapters and 450+
            subtopics aligned with official NTA JEE and NEET UG curricula. Aspirants monitor
            granular completion statuses, track topic confidence ratings, and schedule 4-stage
            revision cycles across Physics, Chemistry, and Mathematics, ensuring systematic
            preparation without relying on fragmented spreadsheets or manual checklists.
          </p>
        </section>
