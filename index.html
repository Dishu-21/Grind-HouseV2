    <style>
      /* Base pre-hydration styling scoped only while the boot loader is active, eliminating white borders without overriding layered post-hydration styles */
      html:has(#app-boot-loader),
      body:has(#app-boot-loader) {
        margin: 0;
        padding: 0;
        background-color: #0a0a0f;
        color-scheme: dark;
        -webkit-font-smoothing: antialiased;
      }

      /* Immediate App Boot Loader - Apple Classic Spinner */
      .app-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background-color: #0a0a0f;
        user-select: none;
      }

      .apple-spinner {
        width: 36px;
        height: 36px;
        color: #f1f5f9;
        animation: appleSpinner 0.8s steps(12, end) infinite;
        transform-origin: center;
      }

      @keyframes appleSpinner {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .apple-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
